{% extends 'hms_app/base.html' %}

{% block title %}Password Reset Complete — MediNEXA HMS{% endblock %}

{% block auth_nav %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-logo">
            <div class="logo-circle" style="background: #10b981; color: white; display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-check" style="font-size: 32px;"></i></div>
            <h2>Password Changed!</h2>
            <p>Your password has been successfully reset. You may now sign in with your new password.</p>
        </div>

        <div style="margin-top: 2rem;">
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg btn-block">
                Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
